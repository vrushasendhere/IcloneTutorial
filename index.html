items:[
/* ---------------- Interface ---------------- */
{cat:"start",icon:"🗺️",title:"The four side tabs",where:"Right edge: Content · Scene · Visual · Modify (+ Render)",level:"Beginner",
 short:"Everything in iClone lives in four tabs on the right edge.",
 more:"<b>Content</b> = the library (drag things in). <b>Scene</b> = list of everything in your scene. <b>Visual</b> = lights, sky, post effects. <b>Modify</b> = settings of whatever is selected. <b>Render</b> = output video/images.",
 ex:"Think of a kitchen: Content is the fridge, Scene is the counter, Modify is the knife you're using right now, Visual is the kitchen lighting.",
 try:["Click each tab once and read its header.","Select the floor, then open Modify – notice the panel changes.","Select a light – Modify changes again."],
 yt:"iClone 8 interface beginner overview"},
{cat:"start",icon:"🖱️",title:"Viewport navigation",where:"Viewport + camera buttons on the toolbar",level:"Beginner",
 short:"Orbit, pan and zoom around the scene.",
 more:"Use the mouse (right / middle button drag and wheel) or the orbit / pan / zoom tool buttons. 'Pick target' style buttons frame the selected object. Navigating the viewport does NOT move the render camera unless you are looking through it.",
 ex:"Walk around Bappa like a sculptor walks around clay — the viewer's eye moves, the statue doesn't.",
 try:["Load any character.","Orbit around her, zoom into the face, pan to the feet.","Use the frame/zoom-to-selected button to snap back."],
 yt:"iClone 8 viewport navigation camera controls"},
{cat:"start",icon:"🧩",title:"Transform gizmo (move / rotate / scale)",where:"Toolbar: select · move · rotate · scale",level:"Beginner",
 short:"Arrows to move, rings to rotate, boxes to scale.",
 more:"Pick a tool, drag the coloured axis (X red, Y green, Z blue). Exact numbers go in Modify → Transform. Local vs world space toggle changes which way the arrows point.",
 ex:"Placing a modak plate exactly in Bappa's hand: move roughly with the gizmo, then type exact numbers in Modify.",
 try:["Add a box from Content → Props → 3D Blocks.","Move it 2 m up using Modify → Transform (200 cm).","Rotate it 45° on Z and scale it to 150%."],
 yt:"iClone 8 transform gizmo move rotate scale"},
{cat:"start",icon:"⚡",title:"Preview quality & Quick Mode",where:"Toolbar dropdowns: Preview / Quick Mode / High Quality",level:"Beginner",
 short:"Trade viewport beauty for speed.",
 more:"Quick/Preview modes simplify shading so playback stays smooth. Switch to High Quality to judge materials, hair and lighting. This doesn't change the final render settings.",
 ex:"Like drafting a drawing in pencil (fast) before inking (pretty).",
 try:["Play an animation in Quick Mode, note the smoothness.","Switch to High Quality and compare skin and shadows."],
 yt:"iClone 8 viewport quality settings performance"},
{cat:"start",icon:"▶️",title:"Realtime vs By-frame playback",where:"Play bar: Realtime / By Frame",level:"Beginner",
 short:"Realtime skips frames to keep speed; By Frame shows every frame.",
 more:"Realtime = true speed, may drop frames on heavy scenes (good for timing). By Frame = every frame, may play slow (good for checking physics, springs, fast action).",
 ex:"Checking a kick's timing → Realtime. Checking if the foot clips through the floor → By Frame.",
 try:["Play a scene in Realtime, then in By Frame, and compare."],
 yt:"iClone realtime vs by frame playback"},
{cat:"start",icon:"🗂️",title:"Scene Manager",where:"Scene tab",level:"Beginner",
 short:"Tree list of everything: hide, lock, select, group.",
 more:"Toggle visibility (eye), lock objects so you don't move them by accident, and select things that are hard to click (lights, small props). Groups keep big sets tidy.",
 ex:"Hiding Bappa's mouse vahana while you animate his hands, then bringing it back.",
 try:["Open Scene tab.","Hide the floor, then show it.","Lock the character and try to drag it in the viewport."],
 yt:"iClone 8 scene manager hide lock group"},
{cat:"start",icon:"📚",title:"Content Manager (library)",where:"Content tab → Template / Custom / Packages",level:"Beginner",
 short:"Your library: characters, motions, props, lights, sets.",
 more:"<b>Template</b> = built-in content. <b>Custom</b> = things you saved. Drag items onto the viewport or onto a character (motions, accessories). Right-click to add to Custom or open the folder.",
 ex:"Saving your finished Bappa as a custom character so every new project starts with one drag.",
 try:["Browse Content → Template → Motion.","Drag a motion onto a character.","Save something into Custom (right-click → Add to Custom)."],
 yt:"iClone 8 content manager custom template"},
{cat:"start",icon:"🧲",title:"Snap, align & pivot",where:"Toolbar align/snap + Modify → Transform / Pivot",level:"Intermediate",
 short:"Drop things on the ground and line them up neatly.",
 more:"'Drop to ground' puts an object on the floor. Align tools line up several props. Editing the pivot changes the point an object rotates around.",
 ex:"A door rotates from its hinge, not its centre — move the pivot to the hinge edge.",
 try:["Lift a prop in the air, then drop it to the ground.","Change a prop's pivot to one edge and rotate it."],
 yt:"iClone 8 pivot edit align snap"},

/* ---------------- Project ---------------- */
{cat:"project",icon:"📁",title:"Project settings (FPS & length)",where:"Project / Timeline settings",level:"Beginner",
 short:"Set frame rate and how long the scene is.",
 more:"iClone defaults to 60 fps. For your 2D paint-over plan, render at 24 fps and paint every 2nd frame. Set the end frame so the timeline isn't longer than your shot.",
 ex:"A 10-second shot at 24 fps = 240 frames.",
 try:["Check your project's fps.","Set the timeline end to 240 frames for a 10-second shot at 24 fps."],
 yt:"iClone 8 project settings fps timeline length"},
{cat:"project",icon:"💾",title:"Save, Save As, Merge",where:"File menu",level:"Beginner",
 short:".iProject saves the whole scene; Merge pulls another scene in.",
 more:"Save often (Ctrl+S) and keep numbered versions (shot01_v01, v02…). Merge Project adds a saved scene (set, lights) into the current one.",
 ex:"Build the temple set once, then merge it into every Bappa shot.",
 try:["Save as shot01_v01.","Make a change, save as shot01_v02.","Open a new project and merge v01 into it."],
 yt:"iClone 8 merge project save versions"},
{cat:"project",icon:"📥",title:"Import (FBX, OBJ, iAvatar, iProp)",where:"File → Import",level:"Intermediate",
 short:"Bring in models and animations from other software.",
 more:"FBX/OBJ for props and rigged models; FBX motions can become iClone motions. Non-Reallusion rigged characters need <b>Characterization</b> (mapping their bones to iClone's) before they animate correctly.",
 ex:"A Ganesha crown modelled in Blender → export FBX → import → attach to the head bone.",
 try:["Import any small OBJ/FBX prop.","Check its scale and fix it in Modify → Transform."],
 yt:"iClone 8 import fbx obj prop"},
{cat:"project",icon:"🧬",title:"Characterization (non-CC characters)",where:"Opens when importing a rigged FBX character",level:"Advanced",
 short:"Teach iClone which bone is the arm, leg, head…",
 more:"Map each bone of a foreign skeleton to iClone's standard (HumanIK) one. After that, all iClone motions work on it. Extra bones can become 'extended bones' (for springs).",
 ex:"A Mixamo or VRoid character: map bones once, then any iClone dance works on it.",
 try:["Import a rigged FBX human (e.g. from Mixamo).","Follow the mapping steps.","Drag an iClone motion on it to test."],
 yt:"iClone 8 characterization fbx character mixamo"},
{cat:"project",icon:"📤",title:"Export FBX / USD",where:"File → Export",level:"Intermediate",
 short:"Send animated characters and scenes to Blender, Unreal, Maya.",
 more:"Export FBX with animation for other software (choose target presets like Blender/Unreal). USD is for Omniverse-style pipelines. For cloth sim in Blender: export the animated body, simulate there.",
 ex:"Animate Bappa's dance in iClone → export FBX → Blender for dhoti cloth simulation.",
 try:["Export a 5-second animated character as FBX with a Blender preset.","Open it in Blender and press play."],
 yt:"iClone 8 export fbx to blender animation"},

{cat:"char",icon:"🎚️",title:"Modify → Attribute",where:"Modify panel → first tab",level:"Beginner",
 short:"Name, transform, visibility, shadows for the selected object.",

{cat:"char",icon:"🎨",title:"Materials & textures",where:"Modify → Material tab (checker icon)",level:"Intermediate",

{cat:"char",icon:"🧷",title:"Attach props to a character",where:"Modify → Attribute → Attach (Link)",level:"Beginner",

{cat:"char",icon:"🌀",title:"Spring (secondary bounce)",where:"Modify → Spring section",level:"Intermediate",

 yt:"iClone 8 spring bones hair accessories"},
{cat:"char",icon:"🦴",title:"HumanIK settings",where:"Modify panel → HumanIK Settings",level:"Advanced",
 short:"Fine-tune how motions fit your character's body.",

 yt:"iClone 8 humanik settings hip offset"},
{cat:"char",icon:"🎭",title:"Persona (idle personality)",where:"Animation menu / character perform options",level:"Intermediate",

/* ---------------- Body animation ---------------- */
{cat:"body",icon:"🕺",title:"Apply motions from the library",where:"Content → Motion → drag onto character",level:"Beginner",

{cat:"body",icon:"✂️",title:"Motion clip editing",where:"Timeline → Motion track → right-click clip",level:"Beginner",
 short:"Trim, loop, speed up, break and blend clips.",

{cat:"body",icon:"🦾",title:"Edit Motion Layer (FK / IK)",where:"Modify → Motion tab (running figure) → Edit Motion Layer",level:"Intermediate",
 short:"Pose any body part by hand, on top of existing motion.",
 more:"<b>FK</b> rotates one bone at a time (arms swinging, spine curls). <b>IK</b> drags hands/feet and the chain follows. Each change makes a key on the motion layer; the original clip stays untouched. Extra bones (breast, trunk, accessories) are not in the picker — they need a plugin.",
 ex:"The walk is fine but Bappa should raise his right hand in blessing — add a layer key on the arm.",

{cat:"body",icon:"🎯",title:"Reach Target & Lock",where:"Edit Motion Layer panel",level:"Intermediate",

 ex:"Bappa's hand stays on his belly while he laughs and rocks.",
 try:["Put a prop near the character.","Use Reach Target to make the hand touch it over 1 second."],
 yt:"iClone 8 reach target lock hand"},
{cat:"body",icon:"👀",title:"Look At",where:"Animation / Modify → Look At",level:"Beginner",

{cat:"body",icon:"🧭",title:"Motion Director (game-style control)",where:"Toolbar MD icon / Modify → MD tab",level:"Intermediate",

{cat:"body",icon:"🛤️",title:"Motion Planning & paths",where:"Toolbar: MOTION PLANNING / Animation → Path",level:"Intermediate",
