<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Creator 4 Field Guide</title>
<link rel="stylesheet" href="assets/guide.css">
</head>
<body>
<header>
  <h1>🧑‍🎨 Character Creator 4 <span>Field Guide</span></h1>
  <input id="search" placeholder="Search any feature… (press / )" autocomplete="off">
  <button class="chip on" data-f="all">All</button>
  <button class="chip" data-f="Beginner">Beginner</button>
  <button class="chip" data-f="Intermediate">Intermediate</button>
  <button class="chip" data-f="Advanced">Advanced</button>
  <button class="chip" data-f="todo">Not done</button>
  <div class="progress"><div class="bar"><i id="barfill"></i></div><span id="ptext"></span></div>
  <a class="switch" href="index.html">🎬 iClone 8 guide →</a>
  <button class="chip" id="theme" title="Light / dark">🌓</button>
</header>
<main>
  <nav id="nav"></nav>
  <section id="content"></section>
</main>
<script>
/* Each entry: cat, icon, title, where, level, short, more, ex, try[], yt(search words)
   Menu names can differ a little between CC4 updates. */
const GUIDE = {product:"Character Creator 4", key:"cc4guide", cats:[
 ["start","🧭","Interface & Navigation"],
 ["base","🧍","Base Character & Body Shape"],
 ["head","🙂","Head & Face Creation"],
 ["skin","🎨","Skin, Eyes & Materials"],
 ["hair","💇","Hair & Beards"],
 ["cloth","👕","Clothes, Shoes & Accessories"],
 ["expr","😄","Expressions & Facial Rig"],
 ["rig","🦴","Rigging, Bones & Poses"],
 ["phys","🌀","Spring & Physics"],
 ["mesh","🔧","Mesh Tools & Optimisation"],
 ["out","📤","Export, Render & Pipeline"]
],
items:[
/* ---------------- Interface ---------------- */
{cat:"start",icon:"🗺️",title:"The CC4 workspace",where:"Content · Scene · Visual · Modify tabs + top toolbar",level:"Beginner",
 short:"Same layout idea as iClone: library, scene list, look, and settings.",
 more:"<b>Content</b> = library (bodies, clothes, hair, skins). <b>Scene</b> = list of what's on the character. <b>Visual</b> = lighting/look of the preview. <b>Modify</b> = settings of the selected part (body, cloth, hair…). Toolbar buttons open Animation Player, Turntable and Create Character.",
 ex:"Building Bappa: Content gives you clothes and jewellery, Modify reshapes his belly and trunk.",
 try:["Click each tab once.","Select the body, then a piece of clothing, and watch Modify change."],
 yt:"Character Creator 4 interface beginner overview"},
{cat:"start",icon:"🖱️",title:"Viewport, quality & lighting presets",where:"Toolbar: quality dropdown (High…) and lighting dropdown",level:"Beginner",
 short:"Orbit around the character and preview it in different lights.",
 more:"Higher viewport quality shows skin and hair properly. Switch lighting presets to check the character in warm, cold or harsh light before sending to iClone.",
 ex:"Check Bappa's skin colour under warm temple light and cool moonlight.",
 try:["Orbit and zoom to the face.","Switch the viewport quality to High.","Try three lighting presets."],
 yt:"Character Creator 4 viewport lighting quality"},
{cat:"start",icon:"🔄",title:"Turntable",where:"Toolbar: Turntable",level:"Beginner",
 short:"Spin the character to check it from every side.",
 more:"Rotates the character slowly so you can spot problems (clothing poking through, odd proportions) without moving the camera.",
 ex:"Spot the dhoti clipping at the back that you never saw from the front.",
 try:["Start Turntable and watch one full turn.","Note any part that looks wrong."],
 yt:"Character Creator 4 turntable"},
{cat:"start",icon:"▶️",title:"Animation Player (motion test)",where:"Toolbar: Animation Player",level:"Beginner",
 short:"Play test motions on the character before sending to iClone.",
 more:"Load idle, walk or dance motions to test how clothes, morphs and springs behave in motion. Problems are much cheaper to fix here.",
 ex:"Play a dance to see whether Bappa's belly morph breaks during a big hip move.",
 try:["Open Animation Player and play a walk.","Load a more extreme motion (jump/dance) and watch the clothes."],
 yt:"Character Creator 4 animation player test motion"},
{cat:"start",icon:"📚",title:"Content Manager & Custom library",where:"Content tab → Template / Custom",level:"Beginner",
 short:"Drag parts onto the character; save your own versions.",
 more:"Template = built-in parts. Custom = your saved characters, clothes, skins and presets. Right-click → Add to Custom to reuse anything.",
 ex:"Save 'Bappa_Base' so every new Ganesha variant starts from it.",
 try:["Drag a clothing item onto the character.","Save the character into Custom."],
 yt:"Character Creator 4 content manager custom"},

/* ---------------- Base & body ---------------- */
{cat:"base",icon:"🆕",title:"Create Character (choose a base)",where:"Toolbar: Create Character / File → New",level:"Beginner",
 short:"Start from a base body: male, female, neutral, stylised.",
 more:"All shaping starts from a base model. Picking the closest base (realistic vs stylised, body type) saves lots of morph work later.",
 ex:"A rounded, stylised base is a better start for Bappa than a slim realistic one.",
 try:["Start a new character.","Compare two different bases side by side (save one, load the other)."],
 yt:"Character Creator 4 create new character base"},
{cat:"base",icon:"🎚️",title:"Morph sliders (body)",where:"Modify → Morph → Body",level:"Beginner",
 short:"Sliders for height, weight, muscles, belly, limbs.",
 more:"Combine many sliders for any body type. Search the slider list by name. Small changes add up — check in Turntable often.",
 ex:"Bappa: more belly, rounder shoulders, shorter legs, chubbier arms.",
 try:["Search for a belly or weight slider and push it.","Shorten the legs a little.","Save the result as a preset."],
 yt:"Character Creator 4 body morph sliders"},
{cat:"base",icon:"📏",title:"Proportions & body scale",where:"Modify → Morph (proportion / bone scale sliders)",level:"Intermediate",
 short:"Change limb lengths and overall proportions, not just fat/muscle.",
 more:"Proportion sliders change bone lengths (long arms, short legs, big head). Stylised characters depend on these.",
 ex:"A bigger head-to-body ratio makes Bappa feel cute and childlike, like Bal Ganesha.",
 try:["Make the head 10% bigger.","Make arms longer, then reset them."],
 yt:"Character Creator 4 proportions stylized character"},
{cat:"base",icon:"🗿",title:"Morph presets & mixing",where:"Content → Morph presets / Modify → Morph",level:"Beginner",
 short:"Apply ready-made body/face shapes and blend them.",
 more:"Presets apply many sliders at once. Apply at partial strength to mix two looks.",
 ex:"50% 'heavy' body preset + 30% 'stylised' face preset as a start for Bappa.",
 try:["Apply a body preset.","Apply another at lower strength and compare."],
 yt:"Character Creator 4 morph presets"},
{cat:"base",icon:"🛠️",title:"Custom morphs (sculpt your own)",where:"Morph creation / GoZ (ZBrush) / OBJ import",level:"Advanced",
 short:"Sculpt a shape elsewhere, bring it back as a slider.",
 more:"Export the base mesh, sculpt in ZBrush/Blender, re-import it as a morph slider (GoZ makes this one click with ZBrush). Sliders can then be mixed and animated.",
 ex:"Sculpt Bappa's elephant head shape and make it a slider from 0–100%.",
 try:["Export the body mesh as OBJ.","Make a small change in Blender and re-import it as a morph."],
 yt:"Character Creator 4 create custom morph slider blender"},

/* ---------------- Head ---------------- */
{cat:"head",icon:"🙂",title:"Face morph sliders",where:"Modify → Morph → Head",level:"Beginner",
 short:"Shape nose, eyes, jaw, lips, ears, cheeks.",
 more:"Detailed sliders per region. Work from big shapes (skull, jaw) to small (nostril, lip corners).",
 ex:"Big friendly ears and soft, round cheeks for Bappa.",
 try:["Change the jaw width.","Make the ears bigger.","Adjust the eye size."],
 yt:"Character Creator 4 face morph sliders"},
{cat:"head",icon:"📸",title:"Headshot (photo to 3D head)",where:"Plugins → Headshot",level:"Intermediate",
 short:"Generate a head from a photo (or from a 3D head mesh).",
 more:"Photo mode builds a head and skin from a single front photo. Mesh mode fits the CC topology onto a head model you already have, keeping it riggable.",
 ex:"Turn a sculpted Ganesha head into a CC head that can talk and emote.",
 try:["Run Headshot with a clear front photo.","Compare the result with the photo and adjust sliders."],
 yt:"Headshot 2 character creator 4 tutorial"},
{cat:"head",icon:"🐘",title:"Non-human heads (creatures, Bappa)",where:"Custom morphs + accessories + Headshot mesh mode",level:"Advanced",
 short:"Combine morphs and rigged accessories for heads that aren't human.",
 more:"Big shape changes go into custom morphs; parts that must move separately (a trunk) work best as a rigged accessory attached to the head bone, with spring bones for secondary motion.",
 ex:"Elephant head shape as a morph + trunk as an accessory with 6–8 bones and springs.",
 try:["Plan which parts are morph vs accessory.","Test one small accessory attached to the head bone."],
 yt:"Character Creator 4 creature head stylized character"},

/* ---------------- Skin & materials ---------------- */
{cat:"skin",icon:"🧴",title:"SkinGen (skin layers)",where:"Modify → SkinGen / Appearance editor",level:"Intermediate",
 short:"Layer skin tone, pores, blemishes, tattoos, makeup.",
 more:"Non-destructive layers: base skin, micro detail, colour zones, decals, makeup. Each layer has strength and mask.",
 ex:"Bappa's sandal-paste tilak and vermilion as makeup/decal layers on the forehead.",
 try:["Change the base skin tone.","Add a makeup or decal layer and lower its strength."],
 yt:"Character Creator 4 SkinGen tutorial"},
{cat:"skin",icon:"🎨",title:"Materials (PBR) & textures",where:"Modify → Material tab",level:"Intermediate",
 short:"Colour, roughness, metallic, normal, opacity, glow.",
 more:"Pick a material and edit its channels or load textures. Digital Human shaders have special settings for skin (subsurface), eyes, teeth, hair.",
 ex:"Gold crown: high metallic, low roughness. Jewels: a little emission.",
 try:["Select a clothing material and change its colour.","Make a piece of jewellery shiny gold."],
 yt:"Character Creator 4 material editing pbr"},
{cat:"skin",icon:"👁️",title:"Eyes, teeth & tongue",where:"Modify → Material (eye/teeth shaders)",level:"Beginner",
 short:"Iris colour/size, sclera, eye wetness, teeth shade.",
 more:"Eyes carry emotion: iris size and a subtle wet highlight make characters feel alive. Teeth colour should be slightly off-white.",
 ex:"Warm brown eyes with a slightly larger iris for a gentle, kind look.",
 try:["Change the iris colour.","Adjust iris size slightly and compare the expression."],
 yt:"Character Creator 4 eye material iris"},
{cat:"skin",icon:"🖌️",title:"Substance Painter link",where:"Toolbar: Substance Painter",level:"Advanced",
 short:"Paint textures in Substance Painter and send them back.",
 more:"Sends the character to Substance Painter with materials set up; painted textures come back into CC4.",
 ex:"Hand-paint ornate patterns on Bappa's dhoti border.",
 try:["Check the Substance Painter link options (requires Substance Painter installed)."],
 yt:"Character Creator 4 substance painter pipeline"},

/* ---------------- Hair ---------------- */
{cat:"hair",icon:"💇",title:"Hair, brows & beards",where:"Content → Hair / Beard / Brow",level:"Beginner",
 short:"Drag on hair, adjust colour, length and style.",
 more:"Hair is a separate item with its own material (root/tip colour, highlights, specular). Brows and beards are separate too.",
 ex:"A side character with a neat grey beard and thick brows.",
 try:["Apply a hairstyle.","Change root and tip colours."],
 yt:"Character Creator 4 hair beard brow"},
{cat:"hair",icon:"✨",title:"Hair shader settings",where:"Modify → Material (hair)",level:"Intermediate",
 short:"Make hair look soft instead of plastic.",
 more:"Tune specular, strand variation, opacity and colour gradients. Check in good lighting.",
 ex:"Soft, slightly glossy black hair under temple lights.",
 try:["Lower specular slightly and compare.","Add colour variation."],
 yt:"Character Creator 4 hair material settings"},
{cat:"hair",icon:"🌬️",title:"Hair physics & springs",where:"Modify → Physics / Edit Spring (hair with bones)",level:"Advanced",
 short:"Hair that swings with motion.",
 more:"Hair with bones uses spring settings; mesh hair can use soft-cloth physics with a weight map (black roots, white tips).",
 ex:"A ponytail that whips when a dancer turns.",
 try:["Load spring-ready hair.","Play a turning motion in Animation Player."],
 yt:"Character Creator 4 hair physics spring"},

/* ---------------- Clothes ---------------- */
{cat:"cloth",icon:"👕",title:"Clothing & layers",where:"Content → Cloth / Modify → Attribute",level:"Beginner",
 short:"Drag clothes on; they fit the body automatically.",
 more:"Clothes conform to body morphs. Layer order (inner/outer) prevents clipping. Hide the body under clothes to avoid poke-through.",
 ex:"Silk dhoti + angavastram scarf layered on Bappa.",
 try:["Put on two layers (shirt + jacket).","Change the layer order and see the effect."],
 yt:"Character Creator 4 clothing layers conform"},
{cat:"cloth",icon:"🩹",title:"Fixing clipping (conform & hide body)",where:"Modify → cloth fitting / body hide options",level:"Intermediate",
 short:"Stop skin poking through clothes.",
 more:"Use conform/fit tools, adjust cloth offset, and hide body polygons under tight clothing. Check with extreme poses.",
 ex:"Belly poking through the dhoti during a dance — hide the hidden body area.",
 try:["Find a pose where skin pokes through.","Fix it by adjusting fit or hiding the body area."],
 yt:"Character Creator 4 fix clothing clipping"},
{cat:"cloth",icon:"⚖️",title:"Transfer skin weights",where:"Modify → Skin Weight → Transfer",level:"Advanced",
 short:"Make imported clothes bend with the body correctly.",
 more:"Copies the body's bone influence onto the cloth, so it follows bends, breathing and extra bones (like breast bones).",
 ex:"A third-party bra not moving with jiggle → transfer weights from the body.",
 try:["Select an imported clothing item.","Transfer skin weights and test with a motion."],
 yt:"Character Creator 4 transfer skin weight clothing"},
{cat:"cloth",icon:"👟",title:"Shoes & heels",where:"Content → Shoes / Modify",level:"Beginner",
 short:"Shoes that adjust the foot pose and height.",
 more:"Heel height settings bend the foot and lift the body so heels don't sink into the floor.",
 ex:"Raise a dancer's heels and check the ankle pose.",
 try:["Apply heels and adjust the heel height."],
 yt:"Character Creator 4 shoes heel height"},
{cat:"cloth",icon:"💍",title:"Accessories (attach to a bone)",where:"Content → Accessory / Create → Accessory",level:"Beginner",
 short:"Jewellery, crowns, weapons, props that follow a bone.",
 more:"Import an OBJ/FBX as an accessory and attach it to the right bone (head, hand, spine). Rigged accessories bring their own bones.",
 ex:"Crown on the head bone, axe in the left hand, trunk on the head with its own bones.",
 try:["Import a small model as an accessory.","Attach it to the head bone and play a motion."],
 yt:"Character Creator 4 create accessory attach bone"},
{cat:"cloth",icon:"🧵",title:"Create your own clothes",where:"Create → Cloth from imported mesh",level:"Advanced",
 short:"Turn a modelled garment into conforming CC clothing.",
 more:"Model in Blender/Marvelous Designer on the CC body, import, convert to cloth, transfer weights. Then it fits any body shape.",
 ex:"A custom pitambar (yellow silk) designed in Marvelous Designer for Bappa.",
 try:["Export the base body to Blender.","Model a simple tube skirt, import it as cloth."],
 yt:"Character Creator 4 create custom clothing blender"},

/* ---------------- Expressions ---------------- */
{cat:"expr",icon:"😄",title:"Facial expressions & profile",where:"Modify → Facial Profile / Expression editor",level:"Intermediate",
 short:"The set of expressions iClone uses to animate the face.",
 more:"A facial profile defines all expression shapes (smile, blink, brow raise, visemes). Choose a profile and adjust individual expressions that look wrong for your character.",
 ex:"Bappa's smile should push his cheeks up more because of his round face.",
 try:["Open the facial profile editor.","Preview the smile and adjust it slightly."],
 yt:"Character Creator 4 facial profile editor"},
{cat:"expr",icon:"🗣️",title:"Visemes (mouth shapes for speech)",where:"Facial profile → visemes",level:"Intermediate",
 short:"Mouth shapes that lip sync uses.",
 more:"If lip sync looks wrong in iClone, fix the viseme shapes here (e.g. 'O', 'F/V', 'M/B/P').",
 ex:"A stylised character's 'O' looks too small — enlarge that viseme.",
 try:["Preview the viseme list.","Adjust one viseme and test lip sync in iClone."],
 yt:"Character Creator 4 visemes lip sync shapes"},
{cat:"expr",icon:"〽️",title:"Dynamic wrinkles",where:"Modify → expression wrinkle settings",level:"Advanced",
 short:"Wrinkles appear when the face moves.",
 more:"Forehead lines when surprised, crow's feet when smiling. Adds realism to close-ups.",
 ex:"Laugh lines when Bappa laughs heartily.",
 try:["Enable wrinkles and test a smile and a surprised face."],
 yt:"Character Creator 4 dynamic wrinkles"},

/* ---------------- Rigging & poses ---------------- */
{cat:"rig",icon:"🧩",title:"AccuRIG (auto-rig any human mesh)",where:"Standalone AccuRIG / CC4 rigging tools",level:"Intermediate",
 short:"Rig a static humanoid model in minutes.",
 more:"Place markers on joints, it builds a skeleton and weights. The result works with CC4/iClone motions.",
 ex:"A 3D-scanned devotee statue that can now walk and dance.",
 try:["Rig any static human model with AccuRIG.","Apply a motion to test it."],
 yt:"AccuRIG auto rig tutorial"},
{cat:"rig",icon:"🦴",title:"Bone Manager",where:"Modify → Bone Manager (F3)",level:"Advanced",
 short:"See and manage all bones, including extra ones.",
 more:"Shows the full bone list (breast, twist, accessory bones), bone types and which bones are used. Starting point for springs and custom bones.",
 ex:"Find CC_Base_L_Breast or the trunk bones before setting springs.",
 try:["Open Bone Manager.","Search for 'Breast' or 'Head' bones."],
 yt:"Character Creator 4 bone manager"},
{cat:"rig",icon:"⚖️",title:"Skin weight editing",where:"Modify → Skin Weight",level:"Advanced",
 short:"Paint which bones move which parts of the mesh.",
 more:"Fix ugly bends (elbows, shoulders) or connect clothes to extra bones by painting weights.",
 ex:"Make the trunk bend smoothly by painting overlapping weights between trunk bones.",
 try:["Open skin weight editing on a cloth item.","Look at one bone's influence (don't save changes yet)."],
 yt:"Character Creator 4 skin weight paint"},
{cat:"rig",icon:"🧬",title:"Characterization (non-standard rigs)",where:"Import FBX → characterization / creature calibration",level:"Advanced",
 short:"Make imported rigged characters and creatures work with CC tools.",
 more:"Map the imported skeleton to CC's standard bones (humanoid) or calibrate creatures/props (Prop and Creature Calibration). Extra bones become extended bones.",
 ex:"A four-armed character: map the main arms, keep extra arms as extended bones.",
 try:["Import a rigged FBX character.","Go through the mapping and test a motion."],
 yt:"Character Creator 4 characterization creature calibration"},
{cat:"rig",icon:"🧘",title:"Poses & pose library",where:"Content → Pose / Animation Player",level:"Beginner",
 short:"Apply poses to check fit or make still images.",
 more:"Poses test clothes in extreme positions and are great for portrait renders.",
 ex:"Lalitasana seated pose for a devotional portrait.",
 try:["Apply a seated pose.","Check clothing in that pose."],
 yt:"Character Creator 4 pose library"},

/* ---------------- Spring & physics ---------------- */
{cat:"phys",icon:"🌀",title:"Edit Spring",where:"Modify → Spring → Edit Spring",level:"Intermediate",
 short:"Make bones bounce: hair, ears, tails, trunks.",
 more:"Select bones, tick Active, choose Rotate (swing) or Translate (stretch), set Hardness (soft at the root, harder at the tip). Group settings: Mass, Strength, Bounciness. Body-bone springs may not work in every build — test with Animation Player.",
 ex:"Trunk bones: soft at the base, firmer at the tip, so it whips naturally.",
 try:["Open Edit Spring on spring-ready hair.","Change Hardness and test with a jump in Animation Player."],
 yt:"Character Creator 4 edit spring bones"},
{cat:"phys",icon:"👗",title:"Soft cloth & weight maps",where:"Modify → Physics → Activate Physics / weight map",level:"Advanced",
 short:"Set up flowing cloth before sending to iClone.",
 more:"Black areas follow the body, white areas simulate. Tight clothes should be mostly black. Preview in Animation Player.",
 ex:"Dupatta ends white (flowing), the part on the shoulder black (pinned).",
 try:["Enable physics on a skirt.","Paint the waist black and test a walk."],
 yt:"Character Creator 4 soft cloth physics weight map"},
{cat:"phys",icon:"🛡️",title:"Collision shapes",where:"Modify → Physics → Edit Collision Shape",level:"Advanced",
 short:"Capsules and spheres on bones that cloth collides with.",
 more:"Add more, smaller shapes on curved parts (belly, chest, thighs) and size them just inside the skin. Save the setup to reuse.",
 ex:"A big sphere on Bappa's belly so the dhoti drapes over it.",
 try:["Open Edit Collision Shape.","Add a sphere on the belly and resize it."],
 yt:"Character Creator 4 edit collision shape cloth"},

/* ---------------- Mesh tools ---------------- */
{cat:"mesh",icon:"🔧",title:"Mesh editing tools",where:"Mesh menu",level:"Intermediate",
 short:"Hide, delete, merge and clean meshes.",
 more:"Delete hidden body polygons, merge pieces, fix normals. Fewer hidden polygons = fewer clipping problems and lighter files.",
 ex:"Remove body polygons hidden under Bappa's full-length dhoti.",
 try:["Look through the Mesh menu options.","Hide a body area under clothing."],
 yt:"Character Creator 4 mesh edit delete hidden mesh"},
{cat:"mesh",icon:"🔺",title:"Subdivision",where:"Modify / Preferences → subdivision level",level:"Beginner",
 short:"Smoother curves at the cost of speed.",
 more:"Higher subdivision = smoother silhouette. Match levels in CC4 and iClone (viewport and render) or shapes look different between them.",
 ex:"Breast and belly curves look faceted in iClone → raise subdivision there.",
 try:["Compare subdivision 0 and 1 on the face silhouette."],
 yt:"Character Creator 4 subdivision level"},
{cat:"mesh",icon:"📉",title:"InstaLOD (optimise)",where:"Toolbar: InstaLOD",level:"Advanced",
 short:"Reduce polygons and merge materials for games or crowds.",
 more:"Create lighter versions (LODs), remesh, merge textures into atlases. Useful for background crowds and real-time engines.",
 ex:"200 devotees in a crowd scene: use a light LOD version for the back rows.",
 try:["Run InstaLOD on a copy of a character.","Compare polygon counts."],
 yt:"Character Creator 4 InstaLOD optimize"},
{cat:"mesh",icon:"🧱",title:"GoZ (ZBrush round trip)",where:"Toolbar / File → GoZ",level:"Advanced",
 short:"Send to ZBrush, sculpt, send back as morphs.",
 more:"One-click transfer to ZBrush; sculpted changes return as morphs or base shape updates.",
 ex:"Sculpt Bappa's elephant forehead bumps in ZBrush.",
 try:["Check whether GoZ is available (needs ZBrush)."],
 yt:"Character Creator 4 GoZ ZBrush workflow"},

/* ---------------- Export ---------------- */
{cat:"out",icon:"🔁",title:"Send to iClone",where:"Toolbar / File → Send Character to iClone",level:"Beginner",
 short:"Move the finished character into iClone for animation.",
 more:"Also used to update a character already in iClone; the animation is kept when replacing.",
 ex:"Fix Bappa's belly in CC4 → send back → his dance is still there.",
 try:["Send a character to iClone.","Change something small in CC4 and send it again (replace)."],
 yt:"Character Creator 4 send to iClone"},
{cat:"out",icon:"💾",title:"Save formats (ccProject / ccAvatar)",where:"File → Save / Export",level:"Beginner",
 short:"Keep an editable project and reusable avatar files.",
 more:"Save the editable project for future changes; save to Custom content for drag-and-drop reuse. Keep numbered versions.",
 ex:"bappa_v01, v02… so you can go back if a morph experiment fails.",
 try:["Save the character twice as v01 and v02."],
 yt:"Character Creator 4 save project avatar"},
{cat:"out",icon:"📤",title:"Export FBX / OBJ / USD",where:"File → Export",level:"Intermediate",
 short:"Send characters to Blender, Unreal, Unity, Maya.",
 more:"Choose target presets (Blender, Unreal, Unity) so bones and materials are set up correctly. Include motions if needed.",
 ex:"Export to Blender for cloth simulation of the dhoti.",
 try:["Export an FBX with the Blender preset.","Import it into Blender."],
 yt:"Character Creator 4 export fbx blender unreal"},
{cat:"out",icon:"🟦",title:"Blender pipeline (CC Blender Tools)",where:"Free add-on for Blender",level:"Advanced",
 short:"Import CC4 characters into Blender with materials ready.",
 more:"Sets up skin, hair and eye shaders and supports physics/spring workflows, plus sending edits back to CC4 in many cases.",
 ex:"Rig Bappa's trunk in Blender and send it back as an accessory.",
 try:["Install CC Blender Tools.","Import a CC4 export into Blender."],
 yt:"CC Blender Tools character creator 4"},
{cat:"out",icon:"🖼️",title:"Render stills & portraits",where:"Render menu / Iray (if installed)",level:"Intermediate",
 short:"Render character portraits directly from CC4.",
 more:"Good for character sheets and references for 2D artists: front, side, back views in neutral light.",
 ex:"A Bappa model sheet (front/side/back) to guide your 2D paint-over.",
 try:["Render front, side and back views at the same size."],
 yt:"Character Creator 4 render character sheet"},
{cat:"out",icon:"🐍",title:"Python scripts",where:"Script menu",level:"Advanced",
 short:"Automate repetitive CC4 tasks.",
 more:"CC4 has a Python API similar to iClone's. Ask Claude for tools like batch exports or auto-setup for springs.",
 ex:"Batch-export 10 character variants with one click.",
 try:["Open the Script menu and find Load Python."],
 yt:"Character Creator 4 python script"}
]};
</script>
<script src="assets/guide.js"></script>
</body>
</html>
